org.gradle.jvmargs=-Xmx2G

# Minecraft 26.3 ships unobfuscated, so no mappings are used.
minecraft_version=26.3
loader_version=0.20.1
fabric_api_version=0.166.2+26.3
java_version=25

# Final released versions (must match the installed JARs' fabric.mod.json).
grand_teleport_version=26.3-build252-rb-cinematic-terrain
dh_bridge_version=0.3.0+rendering-handoff

# Folder holding the installed client mods. Sodium and Mod Menu are compile-only
# dependencies taken from here. Override with -Prb_mods_dir=/path/to/mods.
rb_mods_dir=~/Library/Application Support/ModrinthApp/profiles/emotivist_s server/mods
